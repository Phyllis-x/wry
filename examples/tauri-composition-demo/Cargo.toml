[package]
name = "tauri-composition-demo"
version = "0.1.0"
description = "Verifies the WebView2 composition hosting patch (wry PR #1762 ported to 0.57) under Tauri 2.12"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
tauri = { version = "2.12", features = ["unstable", "custom-protocol", "devtools"] }
wry = "0.57"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[patch.crates-io]
# wry 0.57.1 + tauri-apps/wry#1762, ported: branch pinpaper/webview2-composition-0.57
wry = { git = "https://github.com/Phyllis-x/wry", rev = "ff9a717ad14407dbedfa061154d58a0cb44a0ecc" }

[workspace]
